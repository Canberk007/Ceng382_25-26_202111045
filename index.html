<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Gameplay Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'NiseSegaSonic';
            src: url('NiseSegaSonic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            background-color: #1f0479;
            color: #fff;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/NAnXpDVcb44cU/giphy.gif') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.8;
            z-index: -1;
        }

        .main-button {
            position: absolute;
            top: 85%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 8px solid gold;
            border-radius: 50%;
            box-shadow: 0 0 10px gold, 0 0 20px rgba(255, 215, 0, 0.7);
            background: radial-gradient(circle, gold, #ffd700, #daa520);
            cursor: pointer;
            overflow: hidden;
        }

        .main-button::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 30px;
            width: 20px;
            height: 40px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.8), rgba(255, 255, 200, 0));
            transform: rotate(45deg);
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { transform: rotate(45deg) translateX(-50px); }
            100% { transform: rotate(45deg) translateX(150px); }
        }

        .main-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        @keyframes moveUp {
            0% { top: 85%; }
            100% { top: 10%; }
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate3d(1, 1, 1, 0deg); }
            100% { transform: translate(-50%, -50%) rotate3d(1, 1, 1, 360deg); }
        }

        .main-button.clicked {
            animation: moveUp 1s forwards, spin 2s linear infinite 1s;
        }

        .login-screen {
            display: none;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background: rgba(250, 212, 19, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            text-align: center;
            color: #3a6bff;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .login-screen.show {
            display: block;
            opacity: 1;
        }

        .login-screen h2 {
            margin-bottom: 15px;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffff;
            text-shadow: 0 0 10px #e7e7e7, 0 0 20px #3b00d0;
            font-family: 'NiseSegaSonic', sans-serif;
        }

        .login-screen input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #00059d;
            border-radius: 50px;
            background: rgba(16, 1, 180, 0.5);
            color: #00ffff;
            font-family: 'NiseSegaSonic', sans-serif;
            font-size: 14px;
        }

        .live-clock {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #00ffff;
            text-shadow: 0 0 10px #e7e7e7, 0 0 20px #3b00d0;
            font-family: 'NiseSegaSonic', sans-serif;
        }

        .face-button {
            position: relative;
            width: 150px;
            height: 150px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            transition: transform 1s ease;
        }

        .face-button.spin {
            animation: spin 1s linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .blue-circle {
            position: absolute;
            width: 110px;
            height: 110px;
            background-color: #0052cc;
            border-radius: 50%;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        #undermouth {
            background-color: transparent;
            height: 62px;
            width: 47px;
            position: absolute;
            left: 50px;
            top: 40px;
            border-style: solid;
            border-color: tan;
            border-width: 20px;
            border-radius: 50%;
            border-right: transparent;
            border-top: transparent;
            transform: rotate(-90deg);
            z-index: 2;
        }

        #undereyeright {
            background-color: white;
            height: 56px;
            width: 40px;
            transform: rotate(20deg);
            position: absolute;
            left: 70px;
            top: 40px;
            border-radius: 75% 70% 75% 70%;
            z-index: 2;
        }

        #undereyeleft {
            background-color: white;
            height: 56px;
            width: 25px;
            border-radius: 75% 50% 75% 50%;
            position: absolute;
            left: 45px;
            top: 45px;
            transform: rotate(-6deg);
            z-index: 2;
        }

        #nose {
            background-color: black;
            width: 10px;
            height: 20px;
            position: absolute;
            left: 49px;
            top: 83px;
            border-radius: 70% 75% 70% 75%;
            transform: rotate(-67deg);
            z-index: 2;
        }

        #lefteye {
            background-color: black;
            width: 7px;
            height: 15px;
            position: absolute;
            left: 60px;
            top: 65px;
            border-radius: 50%;
            transform: rotate(-1deg);
            z-index: 2;
        }

        #righteye2 {
            background-color: black;
            width: 7px;
            height: 15px;
            position: absolute;
            left: 90px;
            top: 65px;
            border-radius: 50%;
            transform: rotate(-3deg);
            z-index: 2;
        }

        #spec {
            background-color: white;
            width: 2px;
            height: 2px;
            position: absolute;
            left: 62px;
            top: 67px;
            border-radius: 50%;
            transform: rotate(-1deg);
            z-index: 2;
        }

        #spec2 {
            background-color: white;
            width: 2px;
            height: 2px;
            position: absolute;
            left: 92px;
            top: 67px;
            border-radius: 50%;
            transform: rotate(-3deg);
            z-index: 2;
        }

        .leftEarOuter {
            width: 0;
            height: 0;
            position: absolute;
            left: 28px;
            top: 5px;
            z-index: 1;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid #0052cc;
            transform: rotate(-35deg);
        }

        .rightEarOuter {
            width: 0;
            height: 0;
            position: absolute;
            left: 95px;
            top: 10px;
            z-index: 1;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid #0052cc;
            transform: rotate(35deg);
        }

        .leftEarInner {
            width: 0;
            height: 0;
            position: absolute;
            left: 38px;
            top: 15px;
            z-index: 2;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid tan;
            transform: rotate(-35deg);
        }

        .rightEarInner {
            width: 0;
            height: 0;
            position: absolute;
            left: 103px;
            top: 20px;
            z-index: 2;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid tan;
            transform: rotate(35deg);
        }
    </style>
</head>
<body>
    <div class="button-container">
        <button class="main-button" onclick="startAnimation()"></button>
    </div>

    <div id="loginScreen" class="login-screen">
        <h2>Sonic Gameplay Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" class="face-button">
                <div class="blue-circle"></div>
                <div class="leftEarOuter"></div>
                <div class="rightEarOuter"></div>
                <div class="leftEarInner"></div>
                <div class="rightEarInner"></div>
                <div id="undermouth"></div>
                <div id="undereyeright"></div>
                <div id="undereyeleft"></div>
                <div id="nose"></div>
                <div id="lefteye"></div>
                <div id="righteye2"></div>
                <div id="spec"></div>
                <div id="spec2"></div>
            </button>
        </form>
    </div>

    <div class="live-clock" id="liveClock"></div>

    <script>
        let loginAttempts = [];
        let loginScreenVisible = true;

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;

            loginAttempts.push({ username: username, password: password });
            console.log(loginAttempts);
        });

        function startAnimation() {
            document.querySelector('.main-button').classList.add('clicked');
            setTimeout(function() {
                document.getElementById('loginScreen').classList.add('show');
            }, 1000);
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').textContent =
                `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        }, 1000);

        document.querySelector('.face-button').addEventListener('click', function() {
            this.classList.add('spin');
            setTimeout(() => {
                this.classList.remove('spin');
            }, 1000);
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'h' || event.key === 'H') {
                loginScreenVisible = !loginScreenVisible;
                let loginScreen = document.getElementById('loginScreen');
                loginScreen.style.display = loginScreenVisible ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
