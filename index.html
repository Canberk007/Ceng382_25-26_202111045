<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Gameplay Login</title>
    <style>
        /* Varsayılan font kullanılıyor, özel font kaldırıldı */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            font-family: sans-serif; /* Varsayılan font kullanılıyor */
            background-color: #1f0479;
            color: #fff;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/NAnXpDVcb44cU/giphy.gif') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.8;
            z-index: -1;
        }

        .main-button {
            position: absolute;
            top: 85%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 8px solid gold;
            border-radius: 50%;
            box-shadow: 0 0 10px gold, 0 0 20px rgba(255, 215, 0, 0.7);
            background: radial-gradient(circle, gold, #ffd700, #daa520);
            cursor: pointer;
            overflow: hidden;
        }

        .main-button::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 30px;
            width: 20px;
            height: 40px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.8), rgba(255, 255, 200, 0));
            transform: rotate(45deg);
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% {
                transform: rotate(45deg) translateX(-50px);
            }

            100% {
                transform: rotate(45deg) translateX(150px);
            }
        }

        .main-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        @keyframes moveUp {
            0% {
                top: 85%;
            }

            100% {
                top: 12%;
            }
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate3d(1, 1, 1, 0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate3d(1, 1, 1, 360deg);
            }
        }

        .main-button.clicked {
            animation: moveUp 1s forwards, spin 2s linear infinite 1s;
        }

        .login-screen {
            display: none;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background: rgba(250, 212, 19, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            text-align: center;
            color: #3a6bff;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .login-screen.show {
            display: block;
            opacity: 1;
        }

        .login-screen h2 {
            margin-bottom: 15px;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffff;
            text-shadow: 0 0 10px #e7e7e7, 0 0 20px #3b00d0;
        }

        .login-screen input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #00059d;
            border-radius: 50px;
            background: rgba(16, 1, 180, 0.5);
            color: #00ffff;
            font-family: sans-serif; /* Varsayılan font kullanılıyor */
            font-size: 14px;
        }

        .live-clock {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #00ffff;
            text-shadow: 0 0 10px #e7e7e7, 0 0 20px #3b00d0;
        }

        .face-button {
            position: relative;
            width: 150px;
            height: 150px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            transition: transform 1s ease;
        }

        .face-button.spin {
            animation: spin 1s linear;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .blue-circle {
            position: absolute;
            width: 110px;
            height: 110px;
            background-color: #0052cc;
            border-radius: 50%;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        #undermouth {
            background-color: transparent;
            height: 62px;
            width: 47px;
            position: absolute;
            left: 50px;
            top: 40px;
            border-style: solid;
            border-color: tan;
            border-width: 20px;
            border-radius: 50%;
            border-right: transparent;
            border-top: transparent;
            transform: rotate(-90deg);
            z-index: 2;
        }

        #undereyeright {
            background-color: white;
            height: 56px;
            width: 40px;
            transform: rotate(20deg);
            position: absolute;
            left: 70px;
            top: 40px;
            border-radius: 75% 70% 75% 70%;
            z-index: 2;
        }

        #undereyeleft {
            background-color: white;
            height: 56px;
            width: 25px;
            border-radius: 75% 50% 75% 50%;
            position: absolute;
            left: 45px;
            top: 45px;
            transform: rotate(-6deg);
            z-index: 2;
        }

        #nose {
            background-color: black;
            width: 10px;
            height: 20px;
            position: absolute;
            left: 49px;
            top: 83px;
            border-radius: 70% 75% 70% 75%;
            transform: rotate(-67deg);
            z-index: 2;
        }


    #righteye2 {
        background-color: black;
        width: 7px;
        height: 15px;
        position: absolute;
        left: 90px;
        top: 65px;
        border-radius: 50%;
        transform: rotate(-3deg);
        z-index: 2;
    }

    #spec {
        background-color: white;
        width: 2px;
        height: 2px;
        position: absolute;
        left: 62px;
        top: 67px;
        border-radius: 50%;
        transform: rotate(-1deg);
        z-index: 2;
    }

    #spec2 {
        background-color: white;
        width: 2px;
        height: 2px;
        position: absolute;
        left: 92px;
        top: 67px;
        border-radius: 50%;
        transform: rotate(-3deg);
        z-index: 2;
    }

    .leftEarOuter {
        width: 0;
        height: 0;
        position: absolute;
        left: 28px;
        top: 5px;
        z-index: 1;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 50px solid #0052cc;
        transform: rotate(-35deg);
    }

    .rightEarOuter {
        width: 0;
        height: 0;
        position: absolute;
        left: 95px;
        top: 10px;
        z-index: 1;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 50px solid #0052cc;
        transform: rotate(35deg);
    }

    .leftEarInner {
        width: 0;
        height: 0;
        position: absolute;
        left: 38px;
        top: 15px;
        z-index: 2;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-bottom: 30px solid tan;
        transform: rotate(-35deg);
    }

    .rightEarInner {
        width: 0;
        height: 0;
        position: absolute;
        left: 103px;
        top: 20px;
        z-index: 2;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-bottom: 30px solid tan;
        transform: rotate(35deg);
    }
    #lefteye {
            background-color: black;
            width: 7px;
            height: 15px;
            position: absolute;
            left: 60px;
            top: 65px;
            border-radius: 50%;
            transform: rotate(-1deg);
            z-index: 2;
        }


    #tableSection {
        display: none;
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        background: rgba(250, 212, 19, 0.8);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        color: #3a6bff;
    }

    #tableSection form {
        margin-bottom: 20px;
    }

    #tableSection label {
        display: block;
        margin-bottom: 5px;
    }

    #tableSection input {
        padding: 8px;
        margin-bottom: 10px;
        width: 200px;
    }

    #tableSection table {
        width: 100%;
        border-collapse: collapse;
    }

    #tableSection th, #tableSection td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }

    #tableSection th {
        background-color: #f2f2f2;
    }

    .active-row {
        background-color: yellow;
    }

    .active-input {
        border: 2px solid blue;
    }

    .hover-row {
        background-color: lightblue;
    }
</style></head>
<body>
    <div class="button-container">
        <button class="main-button" onclick="startAnimation()"></button>
    </div>

    <div id="loginScreen" class="login-screen">
        <h2>Sonic Gameplay Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" class="face-button">
                <div class="blue-circle"></div>
                <div class="leftEarOuter"></div>
                <div class="rightEarOuter"></div>
                <div class="leftEarInner"></div>
                <div class="rightEarInner"></div>
                <div id="undermouth"></div>
                <div id="undereyeright"></div>
                <div id="undereyeleft"></div>
                <div id="nose"></div>
                <div id="lefteye"></div>
                <div id="righteye2"></div>
                <div id="spec"></div>
                <div id="spec2"></div>
            </button>
        </form>
    </div>

    <div id="tableSection">
        <form id="classForm">
            <label for="className">Class Name:</label>
            <input type="text" id="className" name="className" required>

            <label for="numberOfPeople">Number of People:</label>
            <input type="number" id="numberOfPeople" name="numberOfPeople" required>

            <label for="description">Description:</label>
            <input type="text" id="description" name="description" required>

            <button type="submit">Submit</button>
        </form>

        <table id="classTable">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th>Number of People</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <div class="live-clock" id="liveClock"></div>

    <script>
        let loginAttempts = [];
        let loginScreenVisible = true;

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;

            if (username === 'admin' && password === 'admin') {
                document.getElementById('loginScreen').classList.remove('show');
                document.getElementById('tableSection').style.display = 'block';
                loginScreenVisible = false;
            } else {
                alert('Geçersiz kullanıcı adı veya şifre. Lütfen tekrar deneyin.');
            }
        });

        function startAnimation() {
            document.querySelector('.main-button').classList.add('clicked');
            setTimeout(function () {
                document.getElementById('loginScreen').classList.add('show');
            }, 2000);
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('liveClock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);

        // table.html içeriği için javascript kodları.

        const classForm = document.getElementById('classForm');
        const classTable = document.getElementById('classTable').getElementsByTagName('tbody')[0];
        const classData = [];

        classForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const className = document.getElementById('className').value;
            const numberOfPeople = parseInt(document.getElementById('numberOfPeople').value);
            const description = document.getElementById('description').value;

            if (isNaN(numberOfPeople) || numberOfPeople < 0) {
                alert("Geçerli bir kişi sayısı girin.");
                return;
            }

            classData.push({ className, numberOfPeople, description });
            updateTable();
            classForm.reset();
        });

        function updateTable() {
            classTable.innerHTML = '';
            classData.forEach(data => {
                const row = classTable.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);
                const cell3 = row.insertCell(2);

                cell1.textContent = data.className;
                cell2.textContent = data.numberOfPeople;
                cell3.textContent = data.description;
            });
        }

        // JavaScript eventleri
        classTable.addEventListener('click', function(event) {
            if (event.target.tagName === 'TD') {
                const row = event.target.parentElement;
                console.log('Satır tıklandı:', classData[row.rowIndex - 1]);
                row.classList.toggle('active-row');
            } else if (event.target.tagName === 'TABLE'){
                if(event.target.id === "classTable"){
                    console.log(classData)
                }
            }
        });

        const inputs = document.querySelectorAll("#tableSection input");
        inputs.forEach(input => {
            input.addEventListener("focus", function(){
                this.classList.add("active-input")
            });
            input.addEventListener("blur", function(){
                this.classList.remove("active-input")
                if(this.id === "numberOfPeople"){
                    if (isNaN(parseInt(this.value)) || parseInt(this.value) < 0) {
                        alert("Geçerli bir kişi sayısı girin.");
                        this.value = "";
                    }
                }
            });
        });

        classTable.addEventListener("mouseover", function(event){
            if (event.target.tagName === 'TD') {
                event.target.parentElement.classList.add("hover-row");
            }
        });

        classTable.addEventListener("mouseout", function(event){
            if (event.target.tagName === 'TD') {
                event.target.parentElement.classList.remove("hover-row");
            }
        });

        classTable.addEventListener("dblclick", function(event){
            if (event.target.tagName === 'TD') {
                const row = event.target.parentElement;
                if(confirm("Satırı silmek istediğinize emin misiniz?")){
                    classData.splice(row.rowIndex - 1 ,1);
                    updateTable();
                }
            }
        });
        document.addEventListener('keydown', function(event) {
    if (event.key.toLowerCase() === 'h') {
        let loginScreen = document.getElementById('loginScreen');
        loginScreen.classList.toggle('show');
    }
});

    </script>
</body>
</html>
