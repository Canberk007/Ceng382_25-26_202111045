<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonic Gameplay Login</title>
  <!-- Google Fonts: Orbitron (Sonic temasına benzer bir font) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      background-color: #1f0479;
      color: #fff;
    }

    /* Soluk Arka Plan GIF */
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://media.giphy.com/media/NAnXpDVcb44cU/giphy.gif') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.8;
      z-index: -1;
    }

    /* Görselli Buton Stili */
    .main-button {
      width: 200px;
      height: 200px;
      border: none;
      background: transparent;
      cursor: pointer;
      background-image: url('sonic.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transition: all 0.5s ease;
      position: absolute;
      top: 85%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .main-button:hover {
      transform: translate(-50%, -50%) scale(2.1);
    }

    @keyframes moveUp {
      0% { top: 85%; }
      100% { top: 10%; }
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .main-button.clicked {
      animation: moveUp 1s forwards, spin 2s linear infinite 1s;
    }

    /* Login Ekranı */
    .login-screen {
      display: none;
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      background: rgba(30, 57, 233, 0.8);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      text-align: center;
      color: #3a6bff;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .login-screen.show {
      display: block;
      opacity: 1;
    }

    .login-screen h2 {
      margin-bottom: 15px;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00ffff;
      text-shadow: 0 0 10px #e7e7e7, 0 0 20px #3b00d0;
    }

    .login-screen input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #00059d;
      border-radius: 50px;
      background: rgba(16, 1, 180, 0.5);
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
    }

    .sonic-submit-button {
      width: 150px;
      height: 150px;
      border: none;
      background: transparent;
      cursor: pointer;
      background-image: url('sonic1.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .sonic-submit-button:hover {
      transform: scale(1.5);
    }

    /* Canlı Saat Stili (Aşağıda gösterilecek) */
    .live-clock {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      color: #00ffff;
      text-shadow: 0 0 10px #e7e7e7, 0 0 20px #3b00d0;
    }
  </style>
</head>
<body>
  <div class="button-container">
    <button class="main-button" onclick="startAnimation()"></button>
  </div>

  <div id="loginScreen" class="login-screen">
    <h2>Sonic Gameplay Login</h2>
    <form id="loginForm">
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="sonic-submit-button"></button>
    </form>
  </div>

  <div class="live-clock" id="liveClock"></div>

  <script>
    function startAnimation() {
      var button = document.querySelector('.main-button');
      var loginScreen = document.getElementById('loginScreen');

      button.classList.add('clicked');

      setTimeout(function() {
        loginScreen.classList.add('show');
      }, 1000);
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      alert('Login successful!');
    });

    function updateClock() {
      const clockElement = document.getElementById('liveClock');
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      clockElement.textContent = `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // 'H' tuşuna basıldığında tüm formu gizleyip gösterme
    document.addEventListener('keydown', function(event) {
      if (event.key === 'H' || event.key === 'h') {
        const loginScreen = document.getElementById('loginScreen');
        loginScreen.style.display = (loginScreen.style.display === 'none') ? 'block' : 'none';
      }
    });
  </script>
</body>
</html>
